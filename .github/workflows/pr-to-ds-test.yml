name: Pull Request Merged Notification

on:
  pull_request:
    types: [closed]

jobs:
  notify:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord Notification
        env:
          MERGED_PR_WEBHOOK: ${{ secrets.MERGED_PR_WEBHOOK }}
        run: |
          if [ -z "$MERGED_PR_WEBHOOK" ]; then
            echo "Error: MERGED_PR_WEBHOOK is not set!"
            exit 1
          fi

          PR_TITLE=$(cat << 'EOF'
          ${{ github.event.pull_request.title }}
          EOF
          )

          AUTHOR=$(cat << 'EOF'
          ${{ github.event.pull_request.user.login }}
          EOF
          )

          MERGED_BY=$(cat << 'EOF'
          ${{ github.event.pull_request.merged_by.login }}
          EOF
          )

          PR_URL="${{ github.event.pull_request.html_url }}"
          PR_NUM="${{ github.event.pull_request.number }}"
          AVATAR="${{ github.event.pull_request.user.avatar_url }}"

          PAYLOAD=$(jq -n \
            --arg title "🟣 PR #$PR_NUM Обновление успешно принято!" \
            --arg desc "**[$PR_TITLE]($PR_URL)**" \
            --arg author_name "$AUTHOR" \
            --arg author_icon "$AVATAR" \
            --arg repo "Utopia-Station-14/utopia-station" \
            --arg merged "@$MERGED_BY" \
            '{
              embeds: [{
                title: $title,
                description: $desc,
                color: 10181046,
                author: {
                  name: $author_name,
                  icon_url: $author_icon
                },
                fields: [
                  { name: "Репозиторий", value: $repo, inline: true },
                  { name: "Автор обновления: ", value: $merged, inline: true }
                ]
              }]
            }')

          curl -H "Content-Type: application/json" \
               -X POST \
               -d "$PAYLOAD" \
               "$MERGED_PR_WEBHOOK"
