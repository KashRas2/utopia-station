name: Pull Request Merged Notification

on:
  pull_request:
    types: [closed]
  pull_request_target:
    types: [closed]

jobs:
  notify:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord Notification
        env:
          MERGED_PR_WEBHOOK: ${{ secrets.MERGED_PR_WEBHOOK }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_NUM: ${{ github.event.pull_request.number }}
          PR_AVATAR: ${{ github.event.pull_request.user.avatar_url }}
          PR_CREATED: ${{ github.event.pull_request.created_at }}
          PR_MERGED: ${{ github.event.pull_request.merged_at }}
        run: |
          if [ -z "$MERGED_PR_WEBHOOK" ]; then
            echo "Error: MERGED_PR_WEBHOOK is not set!"
            exit 1
          fi

          if ! echo "$PR_BODY" | grep -q ":cl:"; then
            echo "В описании PR отсутствует тег :cl:. Уведомление в Discord отправлено не будет."
            exit 0
          fi

          CHANGELOG=$(echo "$PR_BODY" | awk '/:cl:/{flag=1} flag')
          EMBED_DESC=$(printf "%s\n\n%s" "**$PR_TITLE**" "$CHANGELOG")

          CREATED_DATE=$(date -d "$PR_CREATED" +"%d.%m.%Y %H:%M" 2>/dev/null || echo "$PR_CREATED")
          MERGED_DATE=$(date -d "$PR_MERGED" +"%d.%m.%Y %H:%M" 2>/dev/null || echo "$PR_MERGED")

          PAYLOAD=$(jq -n \
            --arg title "🟣 PR #$PR_NUM | Обновление успешно принято!" \
            --arg url "$PR_URL" \
            --arg desc "$EMBED_DESC" \
            --arg author_name "$PR_AUTHOR" \
            --arg author_icon "$PR_AVATAR" \
            --arg created "📅 $CREATED_DATE" \
            --arg merged "🏁 $MERGED_DATE" \
            '{
              embeds: [{
                title: $title,
                url: $url,
                description: $desc,
                color: 10181046,
                author: {
                  name: $author_name,
                  icon_url: $author_icon
                },
                fields: [
                  { name: "Создан", value: $created, inline: true },
                  { name: "Принят", value: $merged, inline: true }
                ]
              }]
            }')

          curl -H "Content-Type: application/json" -X POST -d "$PAYLOAD" "$MERGED_PR_WEBHOOK"
